# Feed posts for /more-about-me/ — records worth coming back to.
#
# Schema
#   id      slug used for the DOM id and the share hash (#post-<id>)
#   images  one or more paths under assets/img/. The first is the tile thumbnail;
#           two or more puts a "multiple" marker on the tile.
#   title   modal heading, also the tile hover label
#   date    optional, YYYY-MM → "Sep 2025". Omitted here on purpose.
#   place   optional, shown after the date as " · <place>"
#   body    optional markdown. Omitted here, so the modal shows the title alone.
#   link    optional, renders "Read the full post" at the bottom of the modal
#   tags    optional, not rendered yet; kept for a future blog tag link-up
#
# Grouped by genre: soul, then hip-hop, then jazz and classical.
# Sleeves are already square, so nothing is lost to the 1:1 tile crop.

- id: cleo-sol-mother
